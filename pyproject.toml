[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-my-bro"
version = "0.2.0"
description = "Self-hosted typed decision model for coding-agent governance"
requires-python = ">=3.11"

[project.scripts]
jev = "jevbro.cli:main"

[tool.setuptools.packages.find]
include = ["jevbro*"]
