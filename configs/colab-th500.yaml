# Thai-only curated training run: 500 hand-authored train cases.
train: data/th_curated_500/train.jsonl
validation: data/th_curated_500/validation.jsonl
base_model: convaiinnovations/laya-multilingual
output: artifacts/laya-th500
epochs: 4
micro_batch: 4
grad_accum: 8
group_size: 4
checkpoint_each_epoch: true
english_weight: 1.0
choice_weight: 1.5
score_weight: 2.0
score_ce_weight: 0.5
score_rps_weight: 1.0
# The handwritten train split is materially imbalanced (especially levels 2-4).
# Effective-number weighting prevents the score head from collapsing toward the
# overrepresented high-risk levels.
score_class_balance_beta: 0.99
# Train the score distribution against its cumulative ordinal boundaries in
# addition to soft CE and RPS. This is the ordinal-risk correction; keep the
# five-class output contract unchanged for Laya checkpoint compatibility.
score_cumulative_weight: 1.0
encoder_lr: 0.000025
head_lr: 0.0001
sigma_start: 0.4
sigma_end: 0.1
seed: 42
device: cuda
